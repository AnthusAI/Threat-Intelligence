version: 1
backend:
  phases:
    build:
      commands:
        - test "$AWS_APP_ID" = "d12wnrx15qbcc2"
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - env | grep -e '^PAPYRUS_' -e '^SITE_ENV=' -e '^NEXT_PUBLIC_' >> .env.production
        - NODE_OPTIONS=--max-old-space-size=6144 npx papyrus-app sync && NODE_OPTIONS=--max-old-space-size=6144 npm run build
        - cp amplify_outputs.json .next/amplify_outputs.json
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
