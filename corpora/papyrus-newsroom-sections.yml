schemaVersion: 1
sections:
  - id: mission
    title: Mission
    shortTitle: Foundational Framing
    type: canonical
    editorialMission: Explain how attacker capability is shifting—and what defenders should revisit before the next incident.
    editorialPolicy: Publish foundational framing about capability diffusion, deepening pressure on high-value targets, and threat-model assumptions that no longer hold. Prioritize clarity over novelty. Prefer primary incident reports, official advisories, and durable research over vendor positioning. Academic papers are background, not the default lead source.
    assignmentGuidance: Focus on durable shifts in attacker economics and defensive assumptions. Connect framing to concrete "what to check now" items. Sensitive AI/ML data-estate exposure belongs here when the subject is blast radius of artifacts, not model quality.
    killCriteria: Reject pieces that restate generic AI hype, fear-mongering, or vendor positioning without a defensible threat-model change.
    enabled: true
    sortOrder: 1

  - id: newsroom
    title: Newsroom
    shortTitle: How We Work
    type: canonical
    editorialMission: Explain how this desk turns curated signals, evidence, and expert judgment into practical briefings.
    editorialPolicy: Prefer journalistic and official sources over academic papers as the default. Academic papers are useful background, not the default lead source. Cover research→reporting→copywriting handoffs, knowledge-base memory, and expert steering. Keep process pieces concrete enough that a reader can tell evidence from speculation.
    assignmentGuidance: Start from a real workflow gap—orientation, source discovery, packet handoff, or review. Surface what agents must preserve (uncertainty, provenance, checks) and what they must not invent.
    killCriteria: Reject meta-AI process essays that do not connect to how this newsroom actually learns or publishes.
    enabled: true
    sortOrder: 2

  - id: aws
    title: AWS
    shortTitle: Platform Exposure
    type: canonical
    editorialMission: Cover AWS exposure patterns where identity, data, keys, and logging gaps line up across accounts.
    editorialPolicy: Prioritize vendor documentation, official security guidance, and exposure-audit workflows over generic cloud news. Translate AWS findings into ranked exposure queues and owner-ready checks. Prefer failure modes over product launches.
    assignmentGuidance: Start from a specific AWS service or control family. Connect configuration settings to blast radius. Prefer exposure audits and findings-pipeline operations over feature announcements.
    killCriteria: Reject AWS product launch coverage unless it materially changes a defender's exposure or control options.
    enabled: true
    sortOrder: 3

  - id: azure
    title: Azure
    shortTitle: Identity Paths
    type: canonical
    editorialMission: Cover Microsoft identity and data paths—and the controls that keep admin access temporary and visible.
    editorialPolicy: Center on Entra ID, Azure RBAC, PIM, Conditional Access, and data classification where access paths reach sensitive systems. Prefer official Microsoft guidance and primary incident lessons over inventory-only hygiene lists.
    assignmentGuidance: Map identity-to-data paths. Treat standing privilege and eligibility as durable targets. End with checks that make admin access temporary, justified, and reviewable.
    killCriteria: Reject Azure feature announcements that do not change blast-radius or privilege-lifetime decisions.
    enabled: true
    sortOrder: 4

  - id: ai
    title: AI
    shortTitle: AI Identities
    type: canonical
    editorialMission: Cover OpenAI workspaces, keys, connectors, and actions treated as production access boundaries.
    editorialPolicy: Treat AI workspaces, API keys, connectors, and actions as identities with power. Prefer official platform security guidance and durable operational patterns over prompt-hygiene essays.
    assignmentGuidance: Start from a trust boundary—key scope, workspace membership, connector reach, or action permissions. Explain revocation and blast-radius separation.
    killCriteria: Reject prompt-engineering tips or model-quality coverage unless production access boundaries are the central subject.
    enabled: true
    sortOrder: 5

  - id: gaming
    title: Gaming
    shortTitle: Personal Blast Radius
    type: rotating
    editorialMission: Cover personal blast-radius separation when games, mods, and launchers are software from strangers.
    editorialPolicy: Focus on consumer isolation patterns—separate machines and accounts, recovery-email paths, and untrusted mod/launcher code. Prefer practical rebuild-cheap advice over enterprise control frameworks.
    assignmentGuidance: Start from a consumer scenario with high blast radius if compromised. Recommend separation patterns that are cheap to adopt and rebuild if needed.
    killCriteria: Reject enterprise-only guidance that assumes centralized IT control for a consumer audience.
    enabled: true
    sortOrder: 6
